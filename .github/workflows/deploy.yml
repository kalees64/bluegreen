name: Blue-Green CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_action:
        description: 'Target Deployment / Traffic Action'
        required: true
        default: 'deploy-blue'
        type: choice
        options:
          - deploy-blue
          - deploy-green
          - switch-traffic-to-green
          - switch-traffic-to-blue
      image_tag:
        description: 'Docker Image Tag'
        required: true
        default: 'v1.0'

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/bluegreen:${{ github.event.inputs.image_tag || 'v1.0' }}
            ${{ secrets.DOCKERHUB_USERNAME }}/bluegreen:latest

  deploy-to-ec2:
    name: Deploy to K3s on EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy Kubernetes manifests to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "k8s"
          target: "~/bluegreen"

      - name: Execute Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "==== Connected to EC2 K3s Cluster ===="

            # 1. Ensure KUBECONFIG permissions
            if [ -f "$HOME/.kube/config" ]; then
              export KUBECONFIG="$HOME/.kube/config"
            elif [ -r "/etc/rancher/k3s/k3s.yaml" ]; then
              export KUBECONFIG="/etc/rancher/k3s/k3s.yaml"
            else
              mkdir -p "$HOME/.kube"
              sudo cp /etc/rancher/k3s/k3s.yaml "$HOME/.kube/config" 2>/dev/null || sudo chmod 644 /etc/rancher/k3s/k3s.yaml
              if [ -f "$HOME/.kube/config" ]; then
                sudo chown $(id -u):$(id -g) "$HOME/.kube/config"
                chmod 600 "$HOME/.kube/config"
                export KUBECONFIG="$HOME/.kube/config"
              else
                export KUBECONFIG="/etc/rancher/k3s/k3s.yaml"
              fi
            fi

            # 2. Ensure Namespace, GatewayClass, Gateway, and Services exist
            kubectl apply -f ~/bluegreen/k8s/namespace.yaml
            kubectl apply -f ~/bluegreen/k8s/gateway/gatewayclass.yaml
            kubectl apply -f ~/bluegreen/k8s/gateway/gateway.yaml
            kubectl apply -f ~/bluegreen/k8s/blue/service.yaml
            kubectl apply -f ~/bluegreen/k8s/green/service.yaml

            ACTION="${{ github.event.inputs.target_action || 'deploy-blue' }}"
            IMAGE_TAG="${{ github.event.inputs.image_tag || 'v1.0' }}"
            DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"

            # Show current cluster traffic weights
            echo "================ Current Routing State ================"
            kubectl get httproute bluegreen-route -n bluegreen -o jsonpath='{range .spec.rules[-1].backendRefs[*]}{"Backend: "}{.name}{" | Weight: "}{.weight}{"%\n"}{end}' 2>/dev/null || echo "Initial deployment (no active route yet)"
            echo "========================================================"

            if [ "$ACTION" = "deploy-blue" ]; then
              echo ">>> Deploying to BLUE ($IMAGE_TAG)..."
              sed -i "s|image:.*|image: ${DOCKER_USER}/bluegreen:${IMAGE_TAG}|g" ~/bluegreen/k8s/blue/deployment.yaml
              kubectl apply -f ~/bluegreen/k8s/blue/
              kubectl rollout restart deployment/bluegreen-blue -n bluegreen
              kubectl rollout status deployment/bluegreen-blue -n bluegreen --timeout=90s
              echo ">>> Blue environment is updated! (If Blue is live, it serves users; if idle, test via X-Version: blue)"

            elif [ "$ACTION" = "deploy-green" ]; then
              echo ">>> Deploying to GREEN ($IMAGE_TAG)..."
              sed -i "s|image:.*|image: ${DOCKER_USER}/bluegreen:${IMAGE_TAG}|g" ~/bluegreen/k8s/green/deployment.yaml
              kubectl apply -f ~/bluegreen/k8s/green/
              kubectl rollout restart deployment/bluegreen-green -n bluegreen
              kubectl rollout status deployment/bluegreen-green -n bluegreen --timeout=90s
              echo ">>> Green environment is updated! (If Green is live, it serves users; if idle, test via X-Version: green)"

            elif [ "$ACTION" = "switch-traffic-to-green" ]; then
              echo ">>> Switching 100% public traffic to GREEN (Blue set to 0%)..."
              kubectl apply -f ~/bluegreen/k8s/gateway/httproute-green.yaml
              echo ">>> Switch complete! GREEN is now ACTIVE (100%), BLUE is IDLE (0%)."

            elif [ "$ACTION" = "switch-traffic-to-blue" ]; then
              echo ">>> Switching 100% public traffic to BLUE (Green set to 0%)..."
              kubectl apply -f ~/bluegreen/k8s/gateway/httproute-blue.yaml
              echo ">>> Switch complete! BLUE is now ACTIVE (100%), GREEN is IDLE (0%)."
            fi
