apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bluegreen-route
  namespace: bluegreen
spec:
  parentRefs:
    - name: bluegreen-gateway
  rules:
    # Rule 1: Header-based test routing (X-Version: green)
    - matches:
        - headers:
            - name: X-Version
              value: green
      backendRefs:
        - name: bluegreen-green-svc
          port: 80

    # Rule 2: Public Traffic (100% Blue, 0% Green)
    - backendRefs:
        - name: bluegreen-blue-svc
          port: 80
          weight: 100
        - name: bluegreen-green-svc
          port: 80
          weight: 0
