apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bluegreen-route
  namespace: bluegreen
spec:
  parentRefs:
    - name: bluegreen-gateway
  rules:
    # Rule 1: Preview test routing for BLUE when GREEN is live
    - matches:
        - headers:
            - name: X-Version
              value: blue
          path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bluegreen-blue-svc
          port: 80

    # Rule 2: Public Traffic (100% Green, 0% Blue)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bluegreen-blue-svc
          port: 80
          weight: 0
        - name: bluegreen-green-svc
          port: 80
          weight: 100
